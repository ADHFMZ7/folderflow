<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- The Vela app icon: the B1 boat, lit from above, on Apple's macOS icon
       grid (an 824 px rounded square in a 1024 px canvas). Render it to a
       1024 px PNG and run `npx tauri icon` on that to make every size. -->
  <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" style="stop-color:#FCF8F1">
  </stop>
  <stop offset="1" style="stop-color:#E6DAC5">
  </stop>
  </linearGradient>
  <linearGradient id="main" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" style="stop-color:#B35A38">
  </stop>
  <stop offset="1" style="stop-color:#7E3219">
  </stop>
  </linearGradient>
  <linearGradient id="jib" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" style="stop-color:#94412A">
  </stop>
  <stop offset="1" style="stop-color:#6A2914">
  </stop>
  </linearGradient>
  <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" style="stop-color:#8E3A21">
  </stop>
  <stop offset="1" style="stop-color:#5E2412">
  </stop>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" style="stop-color:rgba(255,255,255,0.7)">
  </stop>
  <stop offset="0.12" style="stop-color:rgba(255,255,255,0)">
  </stop>
  </linearGradient>
  <filter id="tile" x="-20%" y="-20%" width="140%" height="150%">
  <feDropShadow dx="0" dy="12" stdDeviation="14" style="flood-color:#000;flood-opacity:0.28">
  </feDropShadow>
  </filter>
  <filter id="boat" x="-20%" y="-20%" width="140%" height="150%">
  <feDropShadow dx="0" dy="8" stdDeviation="8" style="flood-color:#5E2412;flood-opacity:0.18">
  </feDropShadow>
  </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" style="fill:url(#bg)" filter="url(#tile)">
  </rect>
  <rect x="100" y="100" width="824" height="824" rx="185" style="fill:url(#shine)">
  </rect>
  <g transform="translate(155.0 171.5) scale(7.0)" filter="url(#boat)">
  <path d="M50 10 C 66 28, 76 50, 78 68 L50 68 Z" style="fill:url(#main)">
  </path>
  <path d="M46 22 L46 68 L24 68 C 30 52, 37 36, 46 22 Z" style="fill:url(#jib)">
  </path>
  <path d="M16 74 H86 C 82 84, 72 89, 62 89 H38 C 28 89, 20 84, 16 74 Z" style="fill:url(#hull)">
  </path>
  </g>
</svg>
